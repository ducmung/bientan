<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử Nghiệm Thay Ảnh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .house-image {
            /* Ảnh to ra một chút */
            transform: scale(1.1); 

            /* Làm mờ ít thôi để chân thực */
            filter: blur(2px); 

            transition: transform 0.3s ease, filter 0.3s ease;
            
            /* Đảm bảo ảnh không bị vỡ hoặc che khuất */
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .house-image:hover {
            /* Hiệu ứng khi di chuột qua, tùy chọn */
            transform: scale(1.15);
            filter: blur(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ngôi nhà của tôi</h1>
        <img src="gerirlger.png" alt="Ảnh ngôi nhà" class="house-image">
        <p>Đây là bức ảnh ngôi nhà mới đã được cập nhật, làm mờ ít đi để trông chân thực và đẹp mắt hơn.</p>
    </div>

</body>
</html>
